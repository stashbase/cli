[package]
name = "stashbase"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
chrono-humanize = "0.2.3"
clap = { version = "4.5.51", features = ["derive"] }
colored_json = "5.0.0"
ctrlc = "3.5.1"
dialoguer = "0.12.0"
directories = "6.0.0"
duct = "1.1.0"
env_logger = "0.10.0"
git2 = "0.20.2"
ignore = "0.4.25"
linked-hash-map = "0.5.6"
linked_hash_set = "0.1.5"
log = { version = "0.4.28", features = ["release_max_level_info"] }
once_cell = "1.21.3"
owo-colors = "4.2.3"
regex = "1.12.2"
reqwest = { version = "0.12.24", features = ["json"] }
reqwest-middleware = "0.4.2"
reqwest-retry = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.33"
sha2 = "0.10.9"
spinoff = "0.8.0"
tabled = "0.14.0"
terminal_size = "0.4.3"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.8"
webbrowser = "1.0.6"
uuid = { version = "1.18.1", features = ["v4", "v7"] }
rand = "0.9.2"
