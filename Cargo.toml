[package]
name = "stashbase"
version = "0.9.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
chrono-humanize = "0.2.3"
clap = { version = "4.6.1", features = ["derive"] }
colored = "2.0.4"
colored_json = "5.0.0"
ctrlc = "3.5.1"
dialoguer = "0.12.0"
directories = "6.0.0"
duct = "1.1.0"
env_logger = "0.11.8"
git2 = "0.21.0"
ignore = "0.4.25"
linked-hash-map = "0.5.6"
linked_hash_set = "0.1.5"
log = { version = "0.4.28", features = ["release_max_level_info"] }
once_cell = "1.21.3"
owo-colors = "4.3.0"
regex = "1.12.2"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
reqwest-middleware = { version = "0.5.2", features = ["json", "query"] }
reqwest-retry = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
sha2 = "0.10.9"
short-uuid = "0.2.1"
spinoff = "0.8.0"
tabled = "0.14.0"
terminal_size = "0.4.3"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
hyper = { version = "1.6", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures-util = "0.3.32"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-platform-verifier = "0.7"
rcgen = "0.11"
toml = "0.9.8"
webbrowser = "1.0.6"
uuid = { version = "1.23.3", features = ["v4", "v7"] }
rand = "0.10.1"
base64 = "0.22.1"
data-encoding = "2.11.0"
hex = "0.4.3"
