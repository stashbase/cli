[package]
name = "env_vault_cli"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
chrono = "0.4.31"
chrono-humanize = "0.2.3"
clap = {version= "4.4.6", features = ["derive"]}
colored_json = "3.2.0"
ctrlc = "3.4.1"
dialoguer = "0.11.0"
directories = "5.0.1"
duct = "0.13.6"
env_logger = "0.10.0"
log = {version = "0.4.20", features = ["release_max_level_info"]}
once_cell = "1.18.0"
owo-colors = "3.5.0"
regex = "1.9.6"
reqwest = { version = "0.11.22", features = ["json"]}
reqwest-middleware = "0.2.4"
reqwest-retry = "0.3.0"
serde = {version = "1.0.188", features = ["derive"]}
serde_json = "1.0.107"
serde_yaml = "0.9.25"
spinoff = "0.8.0"
tabled = "0.14.0"
terminal_size = "0.3.0"
thiserror = "1.0.49"
tokio = {version = "1.33.0", features = ["full"]}
toml = "0.8.2"
webbrowser = "0.8.11"
