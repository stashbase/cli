[agent_profiles.codex-mcp]
project = "booking-app"
environment = "agents-dev"

egress_hosts = [
    "api.openai.com",
    "auth.openai.com",
    "chatgpt.com",
    "mcp.stripe.com",
]

# Context7 expects its key in a custom header.
[agent_profiles.codex-mcp.secrets.CONTEXT7_API_KEY]
from = "GH_TOKEN"
hosts = ["mcp.context7.com"]
header = "CONTEXT7_API_KEY"


# Copilot
[agent_profiles.copilot]
project = "booking-app"
environment = "agents-dev"

egress_hosts = ["*"]
deny_hosts = ["api.stashbase.dev"]


[agent_profiles.copilot.secrets.GH_TOKEN]
hosts = [
    "api.github.com",
    "github.com",
    "copilot-proxy.githubusercontent.com",
    "origin-tracker.githubusercontent.com",
    "*.githubcopilot.com",
]
