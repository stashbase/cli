# Repository-local agent policy. Keep the Stashbase API host out of egress.
[agent_profiles.coding]
# Practical local-agent mode: let Codex and configured MCP tools use the
# internet, but prevent a nested Stashbase CLI from reaching this API.
egress_hosts = ["*"]
deny_hosts = ["api.stashbase.dev"]

file = "./.env.agent-test"
# project = "booking-app"
# environment = "development"


[agent_profiles.coding.secrets.GH_TOKEN]
from = "GITHUB_TOKEN"
# Copilot authenticates across these GitHub-owned endpoints. The token still
# cannot be injected into arbitrary hosts allowed by `egress_hosts`.
hosts = [
    "api.github.com",
    "github.com",
    "copilot-proxy.githubusercontent.com",
    "origin-tracker.githubusercontent.com",
    "*.githubcopilot.com",
]

[agent_profiles.third-party-test]
file = "./.env.third-party-test"
egress_hosts = ["*"]

[agent_profiles.third-party-test.secrets.DEMO_PARTNER_API_KEY]
hosts = ["postman-echo.com"]
header = "x-api-key"
