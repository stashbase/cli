name: Feature request
description: Suggest an idea or a missing capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or problem, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you imagine it working, such as a command, a profile option, or an example.
  - type: input
    id: agent
    attributes:
      label: Agent
      placeholder: claude, codex, cursor, ...
