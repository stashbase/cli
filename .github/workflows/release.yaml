name: Release CLI Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true

jobs:
  build:
    name: Build and Package Binaries
    permissions:
      contents: write # Required to create releases and upload assets
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: stashbase-linux-x64
            display_name: "Linux x64"
            ext: ""
            archive_ext: ".tar.gz"
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: stashbase-macos-x86_64
            display_name: "macOS x86_64 (Intel)"
            ext: ""
            archive_ext: ".tar.gz"
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: stashbase-macos-aarch64
            display_name: "macOS ARM64 (Apple Silicon)"
            ext: ""
            archive_ext: ".tar.gz"
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact: stashbase-windows-x64
            display_name: "Windows x64"
            ext: ".exe"
            archive_ext: ".zip"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Clean dist directory (Linux/macOS)
        if: runner.os != 'Windows'
        run: rm -rf dist && mkdir dist

      - name: Clean dist directory (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist dist rmdir /s /q dist
          mkdir dist

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix - tar.gz)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/stashbase${{ matrix.ext }} dist/${{ matrix.artifact }}${{ matrix.ext }}
          cd dist
          tar -czf ${{ matrix.artifact }}${{ matrix.archive_ext }} ${{ matrix.artifact }}${{ matrix.ext }}

      - name: Package binary (Windows - zip)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          copy target\${{ matrix.target }}\release\stashbase${{ matrix.ext }} dist\${{ matrix.artifact }}${{ matrix.ext }}
          cd dist
          powershell -Command "Compress-Archive -Path '${{ matrix.artifact }}${{ matrix.ext }}' -DestinationPath '${{ matrix.artifact }}${{ matrix.archive_ext }}'"

      - name: Generate checksums (Unix)
        if: runner.os != 'Windows'
        run: cd dist && shasum -a 256 *${{ matrix.archive_ext }} > SHA256SUMS.txt

      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cd dist && powershell -Command "Get-FileHash -Algorithm SHA256 *${{ matrix.archive_ext }} | ForEach-Object { \"$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)\" } | Out-File -Encoding ASCII SHA256SUMS.txt"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: |
            dist/*${{ matrix.archive_ext }}
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
