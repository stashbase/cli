name: Release CLI Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true

jobs:
  build:
    name: Build and Package Binaries
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: stashbase
            display_name: "Linux x64"
            ext: ""
            archive_ext: ".tar.gz"
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: stashbase
            display_name: "Linux ARM64"
            ext: ""
            archive_ext: ".tar.gz"
            use_cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: stashbase
            display_name: "macOS x86_64 (Intel)"
            ext: ""
            archive_ext: ".tar.gz"
            use_cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: stashbase
            display_name: "macOS ARM64 (Apple Silicon)"
            ext: ""
            archive_ext: ".tar.gz"
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact: stashbase
            display_name: "Windows x64"
            ext: ".exe"
            archive_ext: ".zip"
            use_cross: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Clean dist directory (Linux/macOS)
        if: runner.os != 'Windows'
        run: rm -rf dist && mkdir dist

      - name: Clean dist directory (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist dist rmdir /s /q dist
          mkdir dist

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build with cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix - tar.gz)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/stashbase${{ matrix.ext }} dist/stashbase
          cd dist
          VERSION=${{ github.event.inputs.version }}
          VERSION_NUM=${VERSION#v}
          tar -czf ${{ matrix.artifact }}-${VERSION_NUM}-${{ matrix.target }}${{ matrix.archive_ext }} stashbase

      - name: Package binary (Windows - zip)
        if: runner.os == 'Windows'
        run: |
          copy target/${{ matrix.target }}/release/stashbase${{ matrix.ext }} dist/stashbase.exe
          cd dist
          $VERSION = "${{ github.event.inputs.version }}"
          $VERSION_NUM = $VERSION.TrimStart('v')
          Compress-Archive -Path stashbase.exe -DestinationPath ${{ matrix.artifact }}-${VERSION_NUM}-${{ matrix.target }}${{ matrix.archive_ext }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*${{ matrix.archive_ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and upload assets
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release directory
        run: |
          mkdir -p release
          find artifacts -name "*.*" -exec cp {} release/ \;

      - name: Generate consolidated checksums
        run: |
          cd release
          shasum -a 256 *.tar.gz *.zip > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
