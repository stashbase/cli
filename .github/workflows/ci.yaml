name: CI

on:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      # The secret-scan confinement tests skip without a working bubblewrap.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
          # Newer runner images (Ubuntu 26.04, AppArmor 5) no longer ship this
          # profile; allow unprivileged user namespaces for bwrap instead.
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [ -f "$profile" ]; then
            sudo apparmor_parser -r "$profile"
          else
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run tests
        run: cargo test --locked

  ssh-e2e:
    name: SSH commands end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      # `ssh install`, `doctor`, `open` and `uninstall` against a throwaway
      # sshd container, through the real `ssh` client.
      - name: Run the SSH end-to-end test
        run: scripts/ssh-e2e.sh target/debug/stashbase
