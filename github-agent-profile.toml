# Example GitHub capability profile. Copy this into your Stashbase config under
# `agent_profiles`, or use it as the source for a directory profile.
[agent_profiles.github]
project = "project"
environment = "environment"

# Connectivity policy: the agent may contact GitHub, but not Stripe.
egress_hosts = ["api.github.com"]

[agent_profiles.github.secrets.github]
from = "GITHUB_TOKEN"
env = "GITHUB_TOKEN"
header = "Authorization"
value_template = "Bearer {secret}"

# Read repository data and issues/pull requests.
[[agent_profiles.github.secrets.github.rules]]
effect = "allow"
hosts = ["api.github.com"]
methods = ["GET"]
paths = [
  "/user",
  "/repos/*/*",
  "/repos/*/*/issues*",
  "/repos/*/*/pulls*",
]

# Create or update issues, comments, and pull requests.
[[agent_profiles.github.secrets.github.rules]]
effect = "allow"
hosts = ["api.github.com"]
methods = ["POST", "PATCH"]
paths = [
  "/repos/*/*/issues",
  "/repos/*/*/issues/*/comments",
  "/repos/*/*/pulls",
]

# Explicitly keep destructive API actions out of this capability.
[[agent_profiles.github.secrets.github.rules]]
effect = "deny"
hosts = ["api.github.com"]
methods = ["DELETE"]
paths = ["*"]
